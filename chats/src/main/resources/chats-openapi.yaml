openapi: 3.1.0
info:
  title: ParanoiaX Chats API
  description: E2EE chat management, participant handling, invite system, and outbox operations for cryptographic key delivery.
  version: 1.0.0

servers:
  - url: /api
    description: Main API Gateway

tags:
  - name: Chat Management
    description: CRUD operations for chats, participants, and invites
  - name: Cryptographic Key Delivery
    description: ECIES encrypted chat key distribution, rotation, and pending key outbox

paths:
  /v1/chats:
    post:
      tags: [Chat Management]
      summary: Create a new chat
      description: Creates a new group or P2P chat. Uploads the initial AES chat key encrypted for all participants' devices.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChatRequest'
      responses:
        '201':
          description: Chat successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateChatResponse'
    get:
      tags: [Chat Management]
      summary: Get user chats
      description: Retrieves the list of chats the user is a participant of. Returns only metadata, not the cryptographic keys or messages.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: A list of chat metadata objects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChatMetadata'

  /v1/chats/{chat_id}/participants:
    post:
      tags: [Chat Management]
      summary: Add participants to a chat
      description: Adds new users to an existing group chat and distributes the current chat AES key to their devices.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ChatIdRequired'
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddParticipantsRequest'
      responses:
        '204':
          description: Participants successfully added and keys distributed (No Content)

  /v1/chats/{chat_id}/invites:
    post:
      tags: [Chat Management]
      summary: Create a chat invite
      description: Creates an invite link with usage limits and expiration. The client appends the AES chat key to the URL anchor locally.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ChatIdRequired'
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInviteRequest'
      responses:
        '201':
          description: Invite successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatInviteResponse'
        '403':
          description: Forbidden (User lacks permission to create invites)

  /v1/chats/invites/{invite_id}/join:
    post:
      tags: [Chat Management]
      summary: Join chat via invite
      description: Consumes an invite to join a chat. The joining user encrypts the chat key for their own devices and uploads it to the server outbox.
      security:
        - BearerAuth: []
      parameters:
        - name: invite_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinByInviteRequest'
      responses:
        '204':
          description: Successfully joined the chat (No Content)
        '403':
          description: Invite expired or usage limit exceeded
        '404':
          description: Invite not found

  /v1/chats/keys/pending:
    get:
      tags: [Cryptographic Key Delivery]
      summary: Fetch pending keys
      description: Retrieves all pending encrypted AES keys specifically targeted for the current device from the outbox.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: A list of pending encrypted keys
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PendingKey'
    delete:
      tags: [Cryptographic Key Delivery]
      summary: Acknowledge keys
      description: Confirms that the device has successfully decrypted and stored the keys. Permanently deletes these records from the server outbox.
      security:
        - BearerAuth: []
      parameters:
        - name: ids
          in: query
          required: true
          description: Comma-separated array of pending_key_ids
          schema:
            type: string
      responses:
        '204':
          description: Keys successfully acknowledged and deleted (No Content)

  /v1/chats/{chat_id}/keys:
    post:
      tags: [Cryptographic Key Delivery]
      summary: Publish new keys (Rotation)
      description: Pushes a new rotated AES key for a specific chat using CAS operations to prevent race conditions.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ChatIdRequired'
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishKeysRequest'
      responses:
        '201':
          description: Rotated keys successfully published (No Content)
        '409':
          description: Conflict (Race condition detected, client must download the latest key)

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
    ChatIdRequired:
      name: chat_id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    DeviceKeyUpload:
      type: object
      required:
        - id
        - encrypted_key
      properties:
        id:
          type: string
          format: uuid
        encryption_key:
          type: string
          format: base64

    ParticipantUpload:
      type: object
      required:
        - id
        - devices
      properties:
        id:
          type: string
          format: uuid
        devices:
          type: array
          items:
            $ref: '#/components/schemas/DeviceKeyUpload'

    CreateChatRequest:
      type: object
      required:
        - type
        - key_version
        - events_seq
        - participants
      properties:
        name:
          type: string
          nullable: true
        type:
          type: string
          enum: [SAVED, PRIVATE, ISOLATED, GROUP, CHANNEL]
        participants:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ParticipantUpload'

    CreateChatResponse:
      type: object
      properties:
        chat_id:
          type: string
          format: uuid

    ChatMetadata:
      type: object
      properties:
        chat_id:
          type: string
          format: uuid
        type:
          type: string
          enum: [ PRIVATE, GROUP, SAVED, ISOLATED ]
        name:
          type: string
          nullable: true
        events_seq:
          type: integer
        last_activity_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    AddParticipantsRequest:
      type: object
      required:
        - participants
      properties:
        participants:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ParticipantUpload'

    CreateInviteRequest:
      type: object
      properties:
        max_uses:
          type: integer
          nullable: true
          description: Maximum number of times this invite can be used. Null for unlimited.
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: Expiration timestamp. Null for never expires.

    ChatInviteResponse:
      type: object
      required:
        - invite_id
        - chat_id
      properties:
        invite_id:
          type: string
          format: uuid
        chat_id:
          type: string
          format: uuid
        max_uses:
          type: integer
          nullable: true
        uses_count:
          type: integer
        expires_at:
          type: string
          format: date-time
          nullable: true

    JoinByInviteRequest:
      type: object
      required:
        - device_keys
      properties:
        device_keys:
          type: array
          minItems: 1
          description: The chat AES key (from the invite link) encrypted for the joining user's own devices.
          items:
            type: object
            required:
              - device_id
              - encryption_key
            properties:
              device_id:
                type: string
                format: uuid
              encryption_key:
                type: string
                format: base64

    PendingKey:
      type: object
      properties:
        id:
          type: string
          format: uuid
        chat_id:
          type: string
          format: uuid
        key_version:
          type: integer
        encrypted_key:
          type: string
          format: base64

    PublishKeysRequest:
      type: object
      required:
        - key_version
        - device_keys
      properties:
        key_version:
          type: integer
        device_keys:
          type: array
          minItems: 1
          items:
            type: object
            required:
              - device_id
              - encrypted_key
            properties:
              device_id:
                type: string
                format: uuid
              encrypted_key:
                type: string
                format: base64