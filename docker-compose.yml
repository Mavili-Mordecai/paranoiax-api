services:
  postgres:
    image: postgres:17-alpine
    container_name: paranoiax-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: paranoiax
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db-init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    container_name: paranoiax-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  kafka:
    image: apache/kafka:4.3.1
    container_name: paranoiax-kafka
    ports:
      - "9092:9092"
    environment:
      - CLUSTER_ID=ParanoiaXClusterId1234
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9092
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
    restart: unless-stopped

  seaweedfs:
    image: chrislusf/seaweedfs:4.40
    container_name: paranoiax-storage
    command: 'server -dir=/data -s3 -s3.config=/etc/seaweedfs/seaweed-config.json'
    ports:
      - "8333:8333" # S3 API
      - "9333:9333" # Master
      - "8888:8888" # Filer
    volumes:
      - ./storage_data:/data
      - ./seaweedfs.json:/etc/seaweedfs/seaweed-config.json:ro
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  storage_data: